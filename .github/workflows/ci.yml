name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint build scripts and validate the data bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyflakes pytest

      - name: Lint the Python build scripts
        run: pyflakes build_*.py tests/*.py

      - name: Validate the generated data bundle and page references
        run: pytest -q
